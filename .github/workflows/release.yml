name: Build and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        shell: bash
        run: |
          version="$(tr -cd '0-9.' < app/version.txt)-r5"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9][A-Za-z0-9._-]*$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
  portable-linux:
    needs: metadata
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.metadata.outputs.version }}
  arch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build Arch package
        run: |
          mkdir -p dist
          chmod 777 dist
          docker build -t streamlight-builder -f packaging/arch/Dockerfile .
          docker run --rm --mount type=bind,source="$PWD",target=/src,readonly --mount type=bind,source="$PWD/dist",target=/out streamlight-builder bash /src/packaging/arch/build.sh
      - name: Menu tests
        run: |
          docker run --rm --mount type=bind,source="$PWD",target=/src,readonly streamlight-builder bash -c 'mkdir -p /build/tests && cd /build/tests && qmake6 /src/tests/menu/menu.pro && make -j4 && QT_QPA_PLATFORM=offscreen ./menu-tests'
      - name: Package smoke test
        run: |
          docker run --rm --user root --mount type=bind,source="$PWD",target=/src,readonly --mount type=bind,source="$PWD/dist",target=/out streamlight-builder bash /src/packaging/arch/smoke-test.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
  macos:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Build DMG
        env:
          CI_VERSION: ${{ needs.metadata.outputs.version }}
          MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/generate-dmg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
  windows:
    needs: metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build installer and ZIP
        shell: pwsh
        env:
          CI_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $env:PATH += ';C:\Program Files (x86)\Inno Setup 6'
          ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, portable-linux, arch, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber ./*
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file ../packaging/RELEASE-NOTES.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "StreamLight $RELEASE_TAG (experimental)" --notes-file ../packaging/RELEASE-NOTES.md ./*
          fi
